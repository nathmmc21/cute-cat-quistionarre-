<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0f6">
<title>Purrfect Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f8;--ink:#572238;--muted:#916177;--accent:#d53c74;--accent-light:#ed6597;--accent-dark:#b82f60;--border:#edd0dc;--surface:rgba(255,255,255,.82);--font-body:"DM Sans",sans-serif;--font-display:"DM Serif Display",serif}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-width:320px;min-height:100vh;color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #bf3b70;outline-offset:5px}
button:disabled{cursor:not-allowed}
svg{display:block}
[hidden]{display:none!important}

/* Background */
.app-shell{position:relative;isolation:isolate;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.96) 0 17%,transparent 48%),linear-gradient(145deg,#fff8fa 0%,#ffeef4 45%,#fbd9e6 100%)}
.background{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.grid-lines{position:absolute;inset:0;opacity:.25;background-image:linear-gradient(rgba(190,75,117,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(190,75,117,.09) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,transparent,black 20%,black 80%,transparent)}
.glow{position:absolute;border-radius:50%;filter:blur(20px);animation:glow-drift 18s ease-in-out infinite alternate}
.glow-one{width:620px;height:620px;left:-300px;top:10%;background:rgba(255,173,202,.34)}
.glow-two{width:640px;height:640px;right:-300px;bottom:-180px;background:rgba(239,126,168,.26);animation-delay:-7s}
.glow-three{width:380px;height:380px;right:18%;top:-240px;background:rgba(255,200,220,.5);animation-delay:-12s}
.orb{position:absolute;display:grid;place-items:center;width:54px;height:54px;color:rgba(207,73,122,.4);border:1px solid rgba(255,255,255,.85);border-radius:18px;background:rgba(255,255,255,.35);box-shadow:inset 0 0 18px rgba(255,255,255,.6),0 12px 30px rgba(180,69,112,.04);animation:drift 7s ease-in-out infinite}
.orb svg{width:24px;height:24px;fill:currentColor}
.orb-one{left:5%;top:24%;rotate:12deg}
.orb-two{left:12%;bottom:14%;rotate:-14deg;animation-delay:-2s}
.orb-three{right:7%;top:26%;rotate:10deg;animation-delay:-4s}
.orb-four{right:13%;bottom:10%;rotate:-11deg;animation-delay:-6s}
.spark{position:absolute;color:#e45c8e;opacity:.4;font-size:26px;animation:twinkle 4s ease-in-out infinite}
.spark-one{left:23%;top:17%}
.spark-two{right:23%;bottom:15%;animation-delay:-1s}
.spark-three{right:9%;top:53%;font-size:17px;animation-delay:-2s}

/* Header */
.topbar{position:relative;z-index:5;width:min(1220px,calc(100% - 56px));height:88px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(167,73,108,.1)}
.brand{display:flex;align-items:center;gap:12px;color:#672840;text-decoration:none;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;color:#fff;border-radius:11px;background:linear-gradient(145deg,#f26f9f,#cf3f75);box-shadow:0 7px 16px rgba(191,52,104,.22);transform:rotate(-5deg)}
.brand-mark svg{width:19px;height:19px;fill:currentColor}
.top-actions{display:flex;align-items:center;gap:18px}
.little-note{color:#95566e;font-family:var(--font-display);font-size:14px;font-style:italic}
.sound-button{display:grid;place-items:center;width:40px;height:40px;color:#9a4969;border:1px solid rgba(167,73,108,.2);border-radius:50%;background:rgba(255,255,255,.65);transition:transform .2s ease,background .2s ease}
.sound-button:hover{background:#fff;transform:translateY(-2px)}
.sound-button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Layout */
.experience{position:relative;z-index:2;display:grid;grid-template-columns:.95fr 1.05fr;align-items:center;gap:90px;width:min(1120px,calc(100% - 56px));min-height:calc(100svh - 88px);margin:0 auto;padding:60px 0 70px}
.intro-copy{padding-bottom:20px}
.kicker,.card-kicker{color:#b93669;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.kicker{display:flex;align-items:center;gap:9px}
.kicker::before{content:"";width:22px;height:1px;background:#de6792}
.intro-copy h1{margin:20px 0 24px;font-family:var(--font-display);font-size:clamp(52px,5.1vw,76px);font-weight:400;line-height:1.02;letter-spacing:-.045em}
.intro-copy h1 em{color:#d8487d;font-weight:400}
.intro-copy>p{max-width:430px;margin:0;color:var(--muted);font-size:16px;line-height:1.8}
.detail-row{display:flex;align-items:center;gap:12px;margin-top:32px}
.detail-icon{display:grid;place-items:center;width:42px;height:42px;color:#d34e80;border:1px solid #f2cbd9;border-radius:14px;background:rgba(255,255,255,.65)}
.detail-icon svg{width:20px;height:20px;fill:currentColor}
.detail-row strong,.detail-row small{display:block}
.detail-row strong{color:#784357;font-size:12px}
.detail-row small{margin-top:4px;color:#966278;font-size:11px}

/* Card and mascot */
.card-column{position:relative;justify-self:center;width:min(100%,520px);padding-top:168px}
.question-card{position:relative;min-height:370px;padding:42px 40px 36px;border:1px solid rgba(194,83,124,.24);border-radius:34px;background:var(--surface);box-shadow:0 36px 80px rgba(145,47,83,.13),0 4px 16px rgba(145,47,83,.06),inset 0 1px 0 #fff;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.stitch{position:absolute;inset:10px;pointer-events:none;border:1px dashed rgba(213,99,140,.28);border-radius:25px}
.pet-zone{position:absolute;z-index:3;top:0;left:50%;width:230px;height:190px;padding:0;border:0;background:transparent;transform:translateX(-50%)}
.cat-wrap,.cat{display:block;width:100%;height:100%;overflow:visible}
.cat-wrap{position:relative;filter:drop-shadow(0 15px 10px rgba(135,43,76,.12));transition:transform .25s ease}
.pet-zone:hover .cat-wrap{transform:translateY(-5px)}
.pet-zone:active .cat-wrap{transform:translateY(2px) scale(.96)}
.cat-body{transform-origin:115px 140px;animation:breathe 3.6s ease-in-out infinite}
.happy-eyes{opacity:0}
.is-happy .cat-eyes{opacity:0}
.is-happy .happy-eyes{opacity:1}
.float-heart{position:absolute;z-index:4;color:#eb568c;opacity:0}
.float-heart svg{width:18px;height:18px;fill:currentColor}
.heart-one{left:20px;top:65px}
.heart-two{right:18px;top:42px;animation-delay:.3s!important}
.is-happy .float-heart{animation:heart-float 2.4s ease-in-out infinite}
.pet-count{position:absolute;z-index:7;top:32px;right:0;display:flex;align-items:center;gap:5px;padding:6px 10px;color:#fff;border-radius:99px;background:#cf3d73;box-shadow:0 5px 12px rgba(180,48,96,.25);font-size:11px;font-weight:700}
.pet-count svg{width:11px;height:11px;fill:currentColor}
.pet-hint{display:flex;align-items:center;justify-content:center;gap:7px;margin:18px 0 0;color:#955d74;font-family:var(--font-display);font-size:13px;font-style:italic}
.pet-hint svg{width:14px;height:14px;fill:#d75082}

/* Question content */
.card-content{position:relative;z-index:2;text-align:center}
.card-content.enter{animation:enter .35s ease both}
.card-content h2{max-width:390px;margin:12px auto 15px;color:#5c263c;font-family:var(--font-display);font-size:clamp(29px,3vw,39px);font-weight:400;line-height:1.13;letter-spacing:-.025em}
.card-sub{max-width:360px;margin:0 auto 26px;color:#906075;font-size:14px;line-height:1.75}
.primary-button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:54px;margin-top:20px;padding:14px 22px;color:#fff;border:1px solid #c9356c;border-radius:15px;background:linear-gradient(180deg,var(--accent-light),var(--accent));box-shadow:0 6px 0 var(--accent-dark),0 12px 24px rgba(195,48,101,.19);font-size:14px;font-weight:700;transition:transform .18s ease,box-shadow .18s ease}
.primary-button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 0 var(--accent-dark),0 16px 30px rgba(195,48,101,.22)}
.primary-button:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--accent-dark)}
.primary-button:disabled{opacity:.45}
.primary-button svg,.back-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.microcopy{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:25px;color:#956077;font-size:11px}
.microcopy svg{width:12px;height:12px;fill:#d95a8b}

/* Progress */
.progress-head{display:flex;align-items:center;gap:18px;margin-bottom:30px}
.back-button{display:flex;align-items:center;gap:5px;padding:5px 0;color:#955a72;border:0;background:transparent;font-size:12px;font-weight:600}
.back-button:hover{color:var(--accent)}
.back-button svg{width:15px;height:15px;transform:rotate(180deg)}
.progress-meta{flex:1}
.step-label{display:block;margin-bottom:9px;color:#925970;text-align:right;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.progress-track{height:5px;border-radius:99px;background:#f5dce5}
.progress-fill{position:relative;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f178a4,#d63f77);transition:width .35s ease}
.progress-fill::after{content:"";position:absolute;top:-3px;right:-4px;width:11px;height:11px;border:2px solid #fff;border-radius:50%;background:#d73f77;box-shadow:0 2px 5px rgba(160,50,90,.2)}

/* Answers */
.answer-grid,.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.answer-button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:120px;padding:18px 12px;color:#704054;border:1px solid var(--border);border-radius:18px;background:rgba(255,248,251,.9);transition:.2s ease}
.answer-button:hover,.choice-button:hover,.answer-button.selected,.choice-button.selected{color:#ad2f61;border-color:#dc6b96;background:#fff;transform:translateY(-3px);box-shadow:0 12px 24px rgba(153,51,88,.1)}
.answer-icon{display:grid;place-items:center;width:34px;height:34px;color:#d94c80;border-radius:11px;background:#fde4ed}
.answer-icon svg{width:18px;height:18px;fill:currentColor}
.answer-button strong,.answer-button small{display:block}
.answer-button strong{font-size:14px}
.answer-button small{margin-top:5px;color:#98647a;font-size:10px;line-height:1.5}
.choice-button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:12px 16px;color:#6e3a50;border:1px solid var(--border);border-radius:14px;background:rgba(255,250,252,.9);font-size:14px;font-weight:600;transition:.2s ease}
.choice-button svg{width:16px;height:16px;color:#d94a7e;fill:currentColor}

/* Custom name */
.custom-name{display:flex;gap:10px;margin-top:12px}
.custom-name input{flex:1;min-width:0;min-height:50px;padding:0 16px;color:#5d3043;border:1px solid #e9c5d2;border-radius:14px;background:rgba(255,250,252,.95);font-size:14px;outline:none}
.custom-name input::placeholder{color:#9c6d80}
.custom-name input:focus{border-color:#da5989;box-shadow:0 0 0 4px rgba(218,89,137,.1)}
.custom-name button{padding:0 20px;color:#fff;border:1px solid #c9356c;border-radius:14px;background:linear-gradient(180deg,var(--accent-light),var(--accent));font-weight:700}

/* Text field */
.text-box{display:block;margin-top:25px;padding:16px 16px 10px;border:1px solid #e9c5d2;border-radius:17px;background:rgba(255,250,252,.95);transition:.2s ease}
.text-box:focus-within{border-color:#da5989;box-shadow:0 0 0 4px rgba(218,89,137,.1)}
textarea{width:100%;min-height:115px;padding:0;resize:vertical;color:#5d3043;border:0;outline:none;background:transparent;font-size:14px;line-height:1.7}
textarea::placeholder{color:#9c6d80}
.text-meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:#956077;font-size:10px}

/* Results */
.finale-icon{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 18px;color:#fff;border-radius:16px;background:linear-gradient(145deg,#f578a5,#d23a72);box-shadow:0 10px 22px rgba(192,47,100,.22);transform:rotate(-4deg)}
.finale-icon svg{width:24px;height:24px;fill:currentColor}
.vibe-card{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0;padding:15px;border:1px solid #f0cfdb;border-radius:16px;background:#fff8fa}
.vibe-card>div{padding:7px}
.vibe-card>div+div{border-left:1px solid #efd4de}
.vibe-card span,.vibe-card strong{display:block}
.vibe-card span{color:#925b70;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.vibe-card strong{margin-top:5px;color:#6b3047;font-family:var(--font-display);font-size:23px;font-weight:400;overflow-wrap:anywhere}
.summary{display:grid;gap:9px;padding:0;margin:20px 0;list-style:none;text-align:left}
.summary li{padding:12px 14px;border:1px solid #f0d8e1;border-radius:13px;background:rgba(255,248,251,.8);overflow-wrap:anywhere}
.summary small{display:block;margin-bottom:5px;color:#966078;font-size:11px;line-height:1.5}
.summary strong{font-size:13px;line-height:1.6}
.secondary-button{width:100%;min-height:46px;margin-top:17px;padding:12px 18px;color:#9a3c61;border:1px solid #eac2d1;border-radius:14px;background:#fff7fa;font-size:13px;font-weight:600;transition:background .2s ease}
.secondary-button:hover{background:#ffe8f1}
.text-button{margin-top:22px;padding:5px;color:#92546e;border:0;background:transparent;font-size:12px;text-decoration:underline;text-underline-offset:4px}

/* Toast and confetti */
.toast{position:fixed;z-index:50;bottom:24px;left:50%;width:max-content;max-width:calc(100vw - 32px);padding:13px 20px;color:#fff;border-radius:99px;background:#6b2945;box-shadow:0 12px 30px rgba(90,27,52,.2);font-size:13px;text-align:center;opacity:0;transform:translate(-50%,15px);pointer-events:none;transition:.25s ease}
.toast.visible{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;z-index:40;top:-30px;width:9px;height:14px;border-radius:3px;pointer-events:none;animation:confetti-fall 3s ease-in forwards}

/* Animations */
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{50%{transform:translateY(-3px) scaleY(1.015)}}
@keyframes heart-float{0%,100%{opacity:0;transform:translateY(10px) scale(.6) rotate(-8deg)}35%,65%{opacity:.8}70%{transform:translateY(-14px) scale(1) rotate(8deg)}}
@keyframes drift{50%{transform:translateY(-14px) rotate(-5deg)}}
@keyframes glow-drift{to{transform:translate(40px,-30px) scale(1.06)}}
@keyframes twinkle{50%{opacity:.8;transform:scale(1.25) rotate(20deg)}}
@keyframes confetti-fall{to{transform:translate(var(--drift),110vh) rotate(650deg);opacity:0}}

/* Responsive */
@media (max-width:950px){
.experience{grid-template-columns:1fr;gap:38px;padding-top:55px}
.intro-copy{max-width:620px;margin:0 auto;padding-bottom:0;text-align:center}
.kicker,.detail-row{justify-content:center}
.intro-copy>p{margin-inline:auto}
.detail-row{text-align:left}
.card-column{max-width:500px}
}
@media (max-width:560px){
.topbar{width:calc(100% - 32px);height:74px}
.brand{gap:9px;font-size:13px}
.top-actions{gap:12px}
.little-note{font-size:12px;line-height:1.25;text-align:right}
.little-note span{display:block}
.little-note .sep{display:none}
.experience{width:calc(100% - 28px);min-height:auto;gap:34px;padding:42px 0}
.intro-copy h1{font-size:48px}
.intro-copy>p{max-width:350px;font-size:14px}
.detail-row{margin-top:24px}
.card-column{padding-top:150px}
.pet-zone{width:205px;height:170px}
.question-card{min-height:360px;padding:38px 25px 30px;border-radius:28px}
.stitch{border-radius:20px}
.card-content h2{font-size:31px}
.progress-head{gap:12px}
.answer-grid{grid-template-columns:1fr}
.answer-button{flex-direction:row;justify-content:flex-start;min-height:78px;padding-inline:20px;text-align:left}
.orb-one,.orb-three{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.4 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></symbol>
    <symbol id="icon-paw" viewBox="0 0 24 24">
      <ellipse cx="12" cy="16" rx="5.2" ry="4.2"/>
      <ellipse cx="5.4" cy="11.2" rx="2.1" ry="2.7" transform="rotate(-25 5.4 11.2)"/>
      <ellipse cx="9.5" cy="7.2" rx="2.1" ry="2.7" transform="rotate(-8 9.5 7.2)"/>
      <ellipse cx="14.5" cy="7.2" rx="2.1" ry="2.7" transform="rotate(8 14.5 7.2)"/>
      <ellipse cx="18.6" cy="11.2" rx="2.1" ry="2.7" transform="rotate(25 18.6 11.2)"/>
    </symbol>
    <symbol id="icon-arrow" viewBox="0 0 20 20"><path d="M4 10h11M11 5l5 5-5 5"/></symbol>
  </defs>
</svg>

<div class="app-shell">
  <div class="background" aria-hidden="true">
    <div class="glow glow-one"></div><div class="glow glow-two"></div><div class="glow glow-three"></div>
    <div class="grid-lines"></div>
    <div class="orb orb-one"><svg><use href="#icon-heart"/></svg></div>
    <div class="orb orb-two"><svg><use href="#icon-paw"/></svg></div>
    <div class="orb orb-three"><svg><use href="#icon-heart"/></svg></div>
    <div class="orb orb-four"><svg><use href="#icon-paw"/></svg></div>
    <span class="spark spark-one">✦</span><span class="spark spark-two">✦</span><span class="spark spark-three">✦</span>
  </div>

  <header class="topbar">
    <a class="brand" href="#" id="home-link">
      <span class="brand-mark"><svg aria-hidden="true"><use href="#icon-paw"/></svg></span>
      <span>Purrfect Questions</span>
    </a>
    <div class="top-actions">
      <span class="little-note">pogi si Nath</span>
      <button class="sound-button" id="sound-button" type="button" aria-label="Turn sounds on" aria-pressed="false" title="Turn sounds on">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 9v6h4l5 4V5L9 9H5Z"/>
          <path id="sound-waves" d="m17 9 5 5m0-5-5 5"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="experience">
    <section class="intro-copy">
      <span class="kicker">A tiny moment for you</span>
      <h1>A few sweet<br>questions, <em>just for you.</em></h1>
      <p>No pressure, no wrong answers. Just a curious little cat who would love to know you better.</p>
      <div class="detail-row">
        <span class="detail-icon"><svg aria-hidden="true"><use href="#icon-heart"/></svg></span>
        <div>
          <strong><span id="question-count">Four</span> little questions. A little more joy.</strong>
          <small>Take a minute, make a tiny friend.</small>
        </div>
      </div>
    </section>

    <section class="card-column" aria-label="Cat questionnaire">
      <button class="pet-zone" id="pet-button" type="button" aria-label="Pet the cat" title="Pet me!">
        <span class="pet-count" id="pet-count" hidden>
          <svg aria-hidden="true"><use href="#icon-heart"/></svg>
          <span id="pet-number">0</span>
        </span>
        <span class="cat-wrap" id="cat-wrap">
          <span class="float-heart heart-one"><svg aria-hidden="true"><use href="#icon-heart"/></svg></span>
          <span class="float-heart heart-two"><svg aria-hidden="true"><use href="#icon-heart"/></svg></span>
          <svg class="cat" viewBox="0 0 230 190" aria-hidden="true">
            <defs>
              <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffafc"/><stop offset="1" stop-color="#ffd8e6"/></linearGradient>
              <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ebe"/><stop offset="1" stop-color="#ffc5d8"/></linearGradient>
            </defs>
            <g class="cat-body">
              <path d="M55 80 43 19c-1-6 5-10 10-6l43 34M175 80l12-61c1-6-5-10-10-6l-43 34" fill="url(#fur)" stroke="#bc5579" stroke-width="4" stroke-linejoin="round"/>
              <path d="m57 57-7-32 25 22M173 57l7-32-25 22" fill="url(#ear)"/>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================
   CUSTOMIZE YOUR QUESTIONS HERE
   Types: "binary", "choice", "text".
   Keep the two yes/no questions first (the vibe result uses them).
   The choice question with role "catName" names the cat.
   ========================================================= */
const QUESTIONS = [
  {type:"binary",eyebrow:"First things first",title:"Do you like cats?",yesHint:"I’m a cat person",noHint:"Still cute though"},
  {type:"binary",eyebrow:"Be honest",title:"Would you let a cat sit on your keyboard?",yesHint:"Paws have priority",noHint:"I need my space"},
  {type:"choice",role:"catName",allowCustom:true,eyebrow:"A very important decision",title:"Pick a name for my cat",options:["Mochi","Luna","Pickles","Biscuit"]},
  {type:"binary",eyebrow:"Tough one",title:"Would you share your snacks with a cat?",yesHint:"Just a little bite",noHint:"Snacks are sacred"},
  {type:"choice",eyebrow:"Cozy corner",title:"Where should my cat nap?",options:["Sunny window","Warm laptop","Cardboard box","Your lap"]},
  {type:"text",eyebrow:"Tell me more",title:"What’s your favorite thing about cats?",placeholder:"Soft paws, tiny meows…"},
  {type:"text",eyebrow:"One last little thing",title:"What’s one thing that made you smile this week?",placeholder:"A warm coffee, a silly message, sunshine…"}
];

const NAME_INDEX = QUESTIONS.findIndex(q => q.role === "catName");
const NUMBER_WORDS = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];

/* Supabase (the publishable key is safe to expose; row-level security protects the data) */
const SUPABASE_URL = "https://etmujgrtvyuogaebptck.supabase.co";
const SUPABASE_KEY = "sb_publishable_DWjvpM8JyaNJTBLJF36Dig_Adnwgt3X";
let lastSent = "";

async function sendResponses() {
  const body = JSON.stringify({
    cat_name: answers[NAME_INDEX] || null,
    vibe: getVibe().title,
    pet_count: petCount,
    answers: QUESTIONS.map((q, i) => ({question: q.title, answer: answers[i] || null}))
  });

  if (body === lastSent) return; /* avoid duplicate rows if someone goes back and resubmits */
  lastSent = body;

  try {
    const response = await fetch(SUPABASE_URL + "/rest/v1/responses", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Prefer": "return=minimal"
      },
      body
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
  } catch (error) {
    lastSent = "";
    console.warn("Could not save responses:", error);
  }
}

/* State */
let step = -1;
let answers = [];
let drafts = {};
let petCount = 0;
let soundEnabled = false;
let audioContext = null;
let toastTimer, focusTimer, petTimer;

const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const content = document.getElementById("card-content");
const catWrap = document.getElementById("cat-wrap");
const petBadge = document.getElementById("pet-count");
const petNumber = document.getElementById("pet-number");
const tag = document.getElementById("name-tag");
const catName = document.getElementById("cat-name");
const soundButton = document.getElementById("sound-button");

/* Helpers */
function icon(name) {
  return '<svg aria-hidden="true"><use href="#icon-' + name + '"></use></svg>';
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("visible"), 2500);
}

function setCatName(name) {
  tag.style.display = name ? "" : "none";
  catName.textContent = name || "";
  catName.setAttribute("font-size", !name || name.length <= 7 ? "12" : name.length <= 9 ? "10" : "8.5");
}

function updateCat() {
  catWrap.classList.toggle("is-happy", step >= 0 || petCount > 0);
  setCatName(answers[NAME_INDEX]);
  petBadge.hidden = petCount === 0;
  petNumber.textContent = petCount;
}

function makeButton(label, className, onClick) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = className;
  button.innerHTML = label;
  button.addEventListener("click", onClick);
  return button;
}

/* Gentle sounds (only after the user enables them) */
function tone(frequency, duration = 0.12, delay = 0) {
  if (!soundEnabled) return;
  try {
    if (!audioContext) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioContext = new Ctx();
    }
    if (audioContext.state === "suspended") audioContext.resume();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const start = audioContext.currentTime + delay;

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.045, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(start);
    oscillator.stop(start + duration + 0.02);
  } catch {
    /* Audio is optional. */
  }
}

function playHappySound() {
  tone(523.25, 0.15);
  tone(659.25, 0.15, 0.07);
  tone(783.99, 0.2, 0.14);
}

soundButton.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  soundButton.setAttribute("aria-pressed", String(soundEnabled));

  const label = soundEnabled ? "Turn sounds off" : "Turn sounds on";
  soundButton.setAttribute("aria-label", label);
  soundButton.title = label;

  document.getElementById("sound-waves").setAttribute(
    "d",
    soundEnabled ? "M17 8.5c1.4 1.3 1.4 5.7 0 7M19.5 6c3 3 3 9 0 12" : "m17 9 5 5m0-5-5 5"
  );

  if (soundEnabled) playHappySound();
  showToast(soundEnabled ? "Cozy sounds are on" : "Sounds are muted");
});

/* Petting */
document.getElementById("pet-button").addEventListener("click", () => {
  petCount += 1;
  updateCat();
  tone(220, 0.2);
  tone(330, 0.2, 0.08);

  clearTimeout(petTimer);
  catWrap.classList.add("is-happy");
  petTimer = setTimeout(updateCat, 1200);

  if (petCount === 1) showToast("Purrr. You made a tiny friend.");
  else if (petCount % 5 === 0) showToast("This cat is feeling very loved.");

  if (step >= QUESTIONS.length) render(false);
});

/* Navigation */
function start() {
  step = 0;
  playHappySound();
  render(true);
}

function answer(value) {
  answers[step] = value;
  if (QUESTIONS[step].type === "text") drafts[step] = value;

  step += 1;
  playHappySound();
  render(true);

  if (step === QUESTIONS.length) {
    celebrate();
    sendResponses();
  }
}

function goBack() {
  if (step < 0) return;
  step -= 1;
  tone(330, 0.12);
  render(true);
}

function restart() {
  step = -1;
  answers = [];
  drafts = {};
  petCount = 0;
  lastSent = "";
  clearTimeout(petTimer);
  render(true);
}

document.getElementById("home-link").addEventListener("click", event => {
  event.preventDefault();
  restart();
});

/* Vibe result */
function getVibe() {
  const likesCats = answers[0] === "Yes";
  const sharesKeyboard = answers[1] === "Yes";

  if (likesCats && sharesKeyboard) {
    return {
      title: petCount >= 3 ? "Supreme cat royalty" : "Keyboard-sharing saint",
      text: "Kind heart, excellent taste, and fully trusted by tiny paws."
    };
  }
  if (likesCats) {
    return {title: "Certified cat bestie", text: "All the kitty love, with perfectly reasonable desk boundaries."};
  }
  if (sharesKeyboard || petCount >= 2) {
    return {title: "Secret cat softie", text: "Cool on the outside, but the whiskers know the truth."};
  }
  return {title: "Charming cat skeptic", text: "A mysterious soul. The cat accepts this challenge."};
}

/* Render */
function render(moveFocus = false) {
  clearTimeout(focusTimer);
  content.replaceChildren();
  updateCat();

  if (step === -1) renderWelcome();
  else if (step >= QUESTIONS.length) renderFinale();
  else renderQuestion();

  content.classList.remove("enter");
  void content.offsetWidth;
  content.classList.add("enter");

  if (moveFocus) {
    focusTimer = setTimeout(() => {
      const heading = content.querySelector("h2");
      if (heading) {
        heading.tabIndex = -1;
        heading.focus({preventScroll: true});
      }
    }, reducedMotion ? 0 : 200);
  }
}

function renderWelcome() {
  content.innerHTML = `
    <span class="card-kicker">Hello, lovely</span>
    <h2>Ready for something delightful?</h2>
    <p class="card-sub">It takes less than a minute, and there may be a happy cat at the end.</p>
  `;
  content.appendChild(makeButton("Let’s begin " + icon("arrow"), "primary-button", start));

  const note = document.createElement("span");
  note.className = "microcopy";
  note.innerHTML = icon("heart") + " Your answers are sent to Nath";
  content.appendChild(note);
}

function renderQuestion() {
  const question = QUESTIONS[step];
  const percentage = ((step + 1) / QUESTIONS.length) * 100;

  const progress = document.createElement("div");
  progress.className = "progress-head";
  progress.appendChild(makeButton(icon("arrow") + " Back", "back-button", goBack));

  const meta = document.createElement("div");
  meta.className = "progress-meta";
  meta.innerHTML = `
    <span class="step-label">Question ${step + 1} of ${QUESTIONS.length}</span>
    <div class="progress-track" role="progressbar" aria-label="Question progress"
         aria-valuemin="0" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${step + 1}">
      <div class="progress-fill" style="width:${percentage}%"></div>
    </div>
  `;
  progress.appendChild(meta);
  content.appendChild(progress);

  const eyebrow = document.createElement("span");
  eyebrow.className = "card-kicker";
  eyebrow.textContent = question.eyebrow;
  content.appendChild(eyebrow);

  const heading = document.createElement("h2");
  heading.id = "question-heading";
  heading.textContent = question.title;
  content.appendChild(heading);

  if (question.type === "binary") renderBinary(question);
  else if (question.type === "choice") renderChoices(question);
  else renderTextQuestion(question);
}

function renderBinary(question) {
  const grid = document.createElement("div");
  grid.className = "answer-grid";

  [
    {value: "Yes", label: "Absolutely", hint: question.yesHint, icon: "heart"},
    {value: "No", label: "Not really", hint: question.noHint, icon: "paw"}
  ].forEach(option => {
    const button = makeButton(
      `<span class="answer-icon">${icon(option.icon)}</span>
       <span><strong>${option.label}</strong><small>${option.hint}</small></span>`,
      "answer-button",
      () => answer(option.value)
    );
    button.classList.toggle("selected", answers[step] === option.value);
    grid.appendChild(button);
  });

  content.appendChild(grid);
}

function renderChoices(question) {
  const isNameQuestion = question.role === "catName";
  const grid = document.createElement("div");
  grid.className = "choice-grid";

  question.options.forEach(option => {
    const button = makeButton(
      `<span>${escapeHTML(option)}</span>${icon("paw")}`,
      "choice-button",
      () => answer(option)
    );
    button.classList.toggle("selected", answers[step] === option);

    if (isNameQuestion) {
      const preview = () => setCatName(option);
      const reset = () => setCatName(answers[NAME_INDEX]);
      button.addEventListener("mouseenter", preview);
      button.addEventListener("focus", preview);
      button.addEventListener("mouseleave", reset);
      button.addEventListener("blur", reset);
    }

    grid.appendChild(button);
  });

  content.appendChild(grid);

  if (question.allowCustom) {
    const form = document.createElement("div");
    form.className = "custom-name";
    form.innerHTML = `
      <input type="text" maxlength="10" autocomplete="off"
             placeholder="Or type your own name…" aria-label="Custom cat name">
      <button type="button">Use</button>
    `;

    const input = form.querySelector("input");
    input.value = question.options.includes(answers[step]) ? "" : (answers[step] || "");

    input.addEventListener("input", () =>
      setCatName(input.value.trim() || answers[NAME_INDEX])
    );

    const submitName = () => {
      const name = input.value.trim();
      if (name) {
        answer(name);
      } else {
        showToast("Type a name first.");
        input.focus();
      }
    };

    form.querySelector("button").addEventListener("click", submitName);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        submitName();
      }
    });

    content.appendChild(form);
  }
}

function renderTextQuestion(question) {
  const form = document.createElement("div");

  form.innerHTML = `
    <label class="text-box">
      <textarea id="answer-text" maxlength="300"
                aria-labelledby="question-heading" aria-describedby="text-help"></textarea>
      <span class="text-meta">
        <span id="text-help">A tiny happy moment is enough.</span>
        <span id="character-count">0 / 300</span>
      </span>
    </label>
    <button class="primary-button" id="send-button" type="button" disabled>
      Send my answer ${icon("arrow")}
    </button>
  `;

  const textarea = form.querySelector("textarea");
  const sendButton = form.querySelector("#send-button");
  const counter = form.querySelector("#character-count");

  textarea.placeholder = question.placeholder || "Type your answer here…";
  textarea.value = answers[step] || drafts[step] || "";

  function updateField() {
    drafts[step] = textarea.value;
    counter.textContent = textarea.value.length + " / 300";
    sendButton.disabled = !textarea.value.trim();
  }

  updateField();
  textarea.addEventListener("input", updateField);

  sendButton.addEventListener("click", () => {
    if (textarea.value.trim()) answer(textarea.value.trim());
  });

  textarea.addEventListener("keydown", event => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey) && textarea.value.trim()) {
      answer(textarea.value.trim());
    }
  });

  content.appendChild(form);
}

function renderFinale() {
  const vibe = getVibe();

  content.innerHTML = `
    <span class="finale-icon">${icon("heart")}</span>
    <span class="card-kicker">Your cat vibe</span>
    <h2>${escapeHTML(vibe.title)}</h2>
    <p class="card-sub">${escapeHTML(vibe.text)}</p>
    <div class="vibe-card">
      <div><span>Your chosen name</span><strong>${escapeHTML(answers[NAME_INDEX] || "Mochi")}</strong></div>
      <div><span>Cat pets given</span><strong id="result-pet-count">${petCount}</strong></div>
    </div>
  `;

  const summary = document.createElement("ul");
  summary.className = "summary";

  QUESTIONS.forEach((question, index) => {
    const item = document.createElement("li");
    const label = document.createElement("small");
    const value = document.createElement("strong");
    label.textContent = question.title;
    value.textContent = answers[index] || "—";
    item.append(label, value);
    summary.appendChild(item);
  });

  content.appendChild(summary);
  content.appendChild(makeButton("Copy my answers " + icon("arrow"), "primary-button", copyAnswers));
  content.appendChild(makeButton("Save keepsake PNG", "secondary-button", saveKeepsake));
  content.appendChild(makeButton("Start over", "text-button", restart));
}

/* Clipboard */
async function copyAnswers() {
  const vibe = getVibe();
  const text = [
    "Purrfect Questions",
    "My cat vibe: " + vibe.title,
    "",
    ...QUESTIONS.map((q, i) => q.title + "\n" + (answers[i] || "—") + "\n"),
    "Cat pets given: " + petCount
  ].join("\n");

  try {
    if (!navigator.clipboard || !window.isSecureContext) throw new Error("Clipboard API unavailable");
    await navigator.clipboard.writeText(text);
    showToast("Your answers have been copied.");
  } catch {
    const field = document.createElement("textarea");
    const previousFocus = document.activeElement;

    field.value = text;
    field.style.position = "fixed";
    field.style.left = "-9999px";
    document.body.appendChild(field);
    field.select();

    let copied = false;
    try { copied = document.execCommand("copy"); } catch { copied = false; }

    field.remove();
    if (previousFocus instanceof HTMLElement) previousFocus.focus();

    showToast(copied ? "Your answers have been copied." : "Copy was blocked. Select and copy your answers above.");
  }
}

/* PNG keepsake */
async function saveKeepsake() {
  try {
    if (document.fonts) await document.fonts.ready;

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");
    if (!context) throw new Error("Canvas unavailable");

    const width = 1080;
    const textWidth = 780;
    const vibe = getVibe();

    function wrap(text, font, maxWidth) {
      context.font = font;
      const lines = [];
      let line = "";

      for (const character of String(text)) {
        if (character === "\n") { lines.push(line); line = ""; continue; }
        const test = line + character;
        if (line && context.measureText(test).width > maxWidth) {
          lines.push(line.trimEnd());
          line = character.trimStart();
        } else {
          line = test;
        }
      }
      if (line || !lines.length) lines.push(line);
      return lines;
    }

    const titleLines = wrap(vibe.title, '400 54px "DM Serif Display", serif', textWidth);

    const blocks = QUESTIONS.map((question, index) => {
      const questionLines = wrap(question.title, '600 25px "DM Sans", sans-serif', textWidth);
      const answerLines = wrap(answers[index] || "—", '600 33px "DM Sans", sans-serif', textWidth);
      return {
        questionLines,
        answerLines,
        height: 46 + questionLines.length * 35 + 12 + answerLines.length * 45
      };
    });

    const headerHeight = 230 + titleLines.length * 65;
    const height = 100 + headerHeight + blocks.reduce((sum, b) => sum + b.height + 24, 0) + 160;

    canvas.width = width;
    canvas.height = height;

    function roundedRect(x, y, w, h, radius, fill) {
      context.beginPath();
      context.roundRect(x, y, w, h, radius);
      context.fillStyle = fill;
      context.fill();
    }

    const background = context.createLinearGradient(0, 0, width, height);
    background.addColorStop(0, "#fff4f8");
    background.addColorStop(1, "#f6c5d8");
    context.fillStyle = background;
    context.fillRect(0, 0, width, height);

    roundedRect(60, 60, width - 120, height - 120, 44, "#fffafc");

    context.textAlign = "center";
    context.fillStyle = "#b93669";
    context.font = '700 20px "DM Sans", sans-serif';
    context.fillText("PURRFECT QUESTIONS", width / 2, 132);

    context.fillStyle = "#572238";
    context.font = '400 54px "DM Serif Display", serif';

    let y = 212;
    titleLines.forEach(line => {
      context.fillText(line, width / 2, y);
      y += 65;
    });

    context.fillStyle = "#916177";
    context.font = '500 24px "DM Sans", sans-serif';
    context.fillText("A little keepsake, just for you.", width / 2, y + 4);

    y += 64;
    context.textAlign = "left";

    blocks.forEach(block => {
      roundedRect(120, y, 840, block.height, 22, "#ffedf4");

      let textY = y + 39;
      context.fillStyle = "#936176";
      context.font = '600 25px "DM Sans", sans-serif';
      block.questionLines.forEach(line => {
        context.fillText(line, 150, textY);
        textY += 35;
      });

      textY += 12;
      context.fillStyle = "#572238";
      context.font = '600 33px "DM Sans", sans-serif';
      block.answerLines.forEach(line => {
        context.fillText(line, 150, textY);
        textY += 45;
      });

      y += block.height + 24;
    });

    context.textAlign = "center";
    context.fillStyle = "#936176";
    context.font = '500 22px "DM Sans", sans-serif';
    context.fillText(petCount + " cat pets given · pogi si Nath", width / 2, height - 105);

    canvas.toBlob(blob => {
      if (!blob) { showToast("Could not create your keepsake."); return; }

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "purrfect-keepsake.png";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 10000);
      showToast("Your keepsake is ready.");
    }, "image/png");
  } catch {
    showToast("Could not create your keepsake in this browser.");
  }
}

/* Celebration */
function celebrate() {
  if (reducedMotion) return;

  const colors = ["#ee75a1", "#d53c74", "#ffc2d9", "#f6a9c6", "#dba3bf", "#fff"];

  for (let i = 0; i < 48; i++) {
    const particle = document.createElement("span");
    particle.className = "confetti";
    particle.setAttribute("aria-hidden", "true");
    particle.style.left = Math.random() * 100 + "vw";
    particle.style.background = colors[i % colors.length];
    particle.style.animationDelay = Math.random() * 0.7 + "s";
    particle.style.animationDuration = 2.3 + Math.random() * 1.2 + "s";
    particle.style.setProperty("--drift", Math.random() * 240 - 120 + "px");

    document.body.appendChild(particle);
    particle.addEventListener("animationend", () => particle.remove(), {once: true});
  }
}

/* Keyboard shortcuts (native buttons already handle Enter and Space) */
document.addEventListener("keydown", event => {
  if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;

  const target = event.target;
  if (
    target instanceof HTMLElement &&
    (target.matches("textarea, input, button, a") || target.isContentEditable)
  ) return;

  if (step === -1 && event.key === "Enter") {
    event.preventDefault();
    start();
    return;
  }

  if (step < 0 || step >= QUESTIONS.length) return;

  if (event.key === "ArrowLeft") {
    event.preventDefault();
    goBack();
    return;
  }

  const question = QUESTIONS[step];
  const key = event.key.toLowerCase();

  if (question.type === "binary") {
    if (key === "y") answer("Yes");
    if (key === "n") answer("No");
  }

  if (question.type === "choice" && /^[1-9]$/.test(event.key)) {
    const selected = question.options[Number(event.key) - 1];
    if (selected) answer(selected);
  }
});

/* Start */
document.getElementById("question-count").textContent =
  NUMBER_WORDS[QUESTIONS.length] || QUESTIONS.length;
render();
</script>
</body>
</html>
